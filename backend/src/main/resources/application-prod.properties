# ─────────────────────────────────────────
# Database Configuration (Cloud)
# ─────────────────────────────────────────
#spring.datasource.url=${DB_URL}

spring.datasource.url=jdbc:mysql://mysql-38757296-edumind-ai.k.aivencloud.com:21700/defaultdb?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────
# JPA / Hibernate (Production optimized)
# ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ─────────────────────────────────────────
# Server
# ─────────────────────────────────────────
server.port=${PORT:8080}
spring.application.name=studyplanner

# ─────────────────────────────────────────
# Error Handling
# ─────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=always

# ─────────────────────────────────────────
# JWT
# ─────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─────────────────────────────────────────
# Gmail SMTP Configuration
# ─────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ─────────────────────────────────────────
# API Keys (Backend only - never expose)
# ─────────────────────────────────────────
groq.api.key=${GROQ_API_KEY}
groq.api.base-url=https://api.groq.com/openai/v1

# ─────────────────────────────────────────
# File Upload
# ─────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.syllabus.upload-dir=uploads/syllabus

# ─────────────────────────────────────────
# Static Resources
# ─────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/